<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Back office · Immo360 NC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--gold:#0A7A84;--gold-dark:#06575F;--lagoon-pale:#E6F7F5;--ocean:#0B3954;--dark:#0F2A38;--mid:#3E5462;--line:#D3DEE2;--line-strong:#97A8B2;--bg:#E9F0F2;--green:#2E7D4F;--red:#B4442C;--accent:#E8704F}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 'Source Sans 3',system-ui,sans-serif;color:var(--dark);background:var(--bg)}
button,input,select{font:inherit}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 24px;height:60px}
.top b{font-size:20px}.top b span{color:var(--gold)}.top .sp{flex:1}.top small{color:var(--mid)}
.btn{border:0;border-radius:9px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--gold);color:#fff}
.btn:hover{background:var(--gold-dark)}.btn.out{background:#fff;color:var(--dark);border:1.5px solid var(--line-strong)}.btn.out:hover{border-color:var(--dark)}
.btn.red{background:#fff;color:var(--red);border:1.5px solid #E2B2A6}.btn.sm{padding:6px 11px;font-size:14px}
.wrap{max-width:1200px;margin:24px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 14px rgba(15,42,56,.05)}
.login{max-width:420px;margin:60px auto}.login h1{margin:0 0 4px;color:var(--ocean)}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input,select{width:100%;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:8px;background:#fff}
.msg{margin:12px 0 0;font-size:15px}.err{color:var(--red)}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px;width:fit-content;margin-bottom:18px;flex-wrap:wrap}
.tab{background:none;border:0;border-radius:9px;padding:9px 16px;font-weight:600;color:var(--mid);cursor:pointer}
.tab.on{background:var(--gold);color:#fff}.tab .n{display:inline-block;min-width:22px;padding:0 6px;border-radius:99px;background:var(--accent);color:#fff;font-size:13px;margin-left:6px}
.tab.on .n{background:#fff;color:var(--gold)}
h2{margin:0 0 4px;color:var(--ocean)}.sub{color:var(--mid);margin:0 0 14px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--line);vertical-align:top;font-size:15px}
th{font-size:13px;color:var(--mid);border-top:0}td small{color:var(--mid)}
.st{display:inline-block;font-size:13px;font-weight:700;padding:2px 9px;border-radius:99px}
.st.att{background:#FFF1D6;color:#7A4B00}.st.ok{background:#E6F4EA;color:#1E6B3A}.st.ko{background:#FBEAE6;color:#8A2E1C}.st.off{background:#EEF2F6;color:#475569}
.acts{display:flex;gap:6px;flex-wrap:wrap}.empty{color:var(--mid);padding:18px 0}
.modes{display:grid;gap:10px;max-width:640px}.mode{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font-weight:400;margin:0}
.mode input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold)}.mode b{display:block}.mode.on{border-color:var(--gold);background:var(--lagoon-pale)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.bar input{max-width:320px}
@media(max-width:800px){table,thead,tbody,tr,td,th{display:block}thead{display:none}tr{border-top:1px solid var(--line);padding:8px 0}td{border:0;padding:4px 0}}
</style>
</head>
<body>
<header class="top"><b>Immo<span>360</span></b><small>Back office</small><span class="sp"></span><small id="who"></small><button type="button" class="btn out sm" id="out" hidden>Déconnexion</button></header>
<main class="wrap" id="app"><p>Chargement…</p></main>
<script src="js/tarifs.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
