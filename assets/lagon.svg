<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <!-- Illustration originale Immo360 : lagon calédonien (ciel, large, récif, lagon, îlot, sable) -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FCFE4"/><stop offset=".55" stop-color="#C6ECF1"/><stop offset="1" stop-color="#EAF8F5"/>
    </linearGradient>
    <linearGradient id="large" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6E9A"/><stop offset="1" stop-color="#1F86A8"/>
    </linearGradient>
    <linearGradient id="lagon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DB8C0"/><stop offset=".45" stop-color="#4FD1C7"/><stop offset="1" stop-color="#9BE7DC"/>
    </linearGradient>
    <linearGradient id="sable" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EAD2"/><stop offset="1" stop-color="#EEDDBE"/>
    </linearGradient>
    <radialGradient id="soleil" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFF6D8"/><stop offset=".45" stop-color="#FFE7A6" stop-opacity=".9"/><stop offset="1" stop-color="#FFE7A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#ciel)"/>
  <circle cx="1240" cy="150" r="150" fill="url(#soleil)"/>
  <circle cx="1240" cy="150" r="44" fill="#FFF3CF"/>
  <!-- nuages -->
  <g fill="#fff" opacity=".85">
    <ellipse cx="300" cy="120" rx="120" ry="18"/><ellipse cx="360" cy="106" rx="70" ry="20"/>
    <ellipse cx="900" cy="80" rx="90" ry="12"/><ellipse cx="950" cy="70" rx="50" ry="14"/>
    <ellipse cx="1480" cy="260" rx="80" ry="10"/>
  </g>
  <!-- montagnes de la Grande Terre au loin -->
  <path d="M0 330 L120 300 L220 312 L330 270 L430 296 L560 262 L650 290 L760 300 L760 360 L0 360z" fill="#6FA7B8" opacity=".55"/>
  <!-- large -->
  <rect y="340" width="1600" height="80" fill="url(#large)"/>
  <!-- récif : ligne d'écume -->
  <path d="M0 418 C120 410 220 424 340 416 S560 408 700 418 S960 428 1100 416 S1380 408 1600 418 V430 H0z" fill="#fff" opacity=".9"/>
  <path d="M0 426 C160 432 300 420 460 428 S800 436 980 426 S1300 420 1600 430 V438 H0z" fill="#E6FAF7" opacity=".7"/>
  <!-- lagon -->
  <rect y="432" width="1600" height="268" fill="url(#lagon)"/>
  <!-- reflets -->
  <g stroke="#fff" stroke-linecap="round" opacity=".45" stroke-width="3" fill="none">
    <path d="M140 500 h90"/><path d="M380 540 h140"/><path d="M700 492 h70"/><path d="M860 560 h120"/>
    <path d="M300 610 h80"/><path d="M1060 520 h60"/><path d="M560 640 h110"/>
  </g>
  <!-- patates de corail sous l'eau -->
  <g fill="#2AA6A8" opacity=".35">
    <ellipse cx="520" cy="585" rx="70" ry="12"/><ellipse cx="760" cy="620" rx="50" ry="9"/><ellipse cx="240" cy="560" rx="40" ry="7"/>
  </g>
  <!-- îlot -->
  <path d="M1080 520 C1150 470 1380 462 1480 512 C1420 532 1150 538 1080 520z" fill="#F4E6C8"/>
  <path d="M1110 512 C1180 488 1340 482 1440 506 C1360 514 1180 518 1110 512z" fill="#5E9E5A"/>
  <path d="M1150 505 C1200 478 1300 474 1390 498 C1320 502 1200 506 1150 505z" fill="#4C8A4B"/>
  <!-- cocotiers -->
  <g fill="none" stroke="#3B5B3A" stroke-width="5" stroke-linecap="round">
    <path d="M1250 500 C1252 450 1262 410 1282 380"/>
    <path d="M1320 500 C1316 462 1308 432 1296 404"/>
  </g>
  <g fill="#2F6E3E">
    <path d="M1282 380 c-30 -10 -58 2 -74 20 c26 -8 50 -8 74 -20z"/>
    <path d="M1282 380 c22 -24 52 -26 72 -16 c-28 2 -50 6 -72 16z"/>
    <path d="M1282 380 c-6 -28 -30 -44 -52 -46 c20 12 36 26 52 46z"/>
    <path d="M1282 380 c16 -2 44 12 54 34 c-20 -14 -36 -24 -54 -34z"/>
    <path d="M1296 404 c-26 -14 -54 -6 -70 10 c24 -4 46 -4 70 -10z"/>
    <path d="M1296 404 c18 -22 46 -26 66 -18 c-26 4 -46 8 -66 18z"/>
    <path d="M1296 404 c10 4 32 22 34 44 c-12 -18 -24 -32 -34 -44z"/>
  </g>
  <!-- pirogue à voile -->
  <g transform="translate(860 470)">
    <path d="M0 26 h70 l-8 8 h-54z" fill="#12303F"/>
    <path d="M34 26 V-28 L64 22z" fill="#fff"/><path d="M34 26 V-12 L12 22z" fill="#F0F6F5"/>
  </g>
  <!-- plage au premier plan -->
  <path d="M0 640 C220 612 460 628 700 650 S1200 676 1600 640 V700 H0z" fill="url(#sable)"/>
  <path d="M0 640 C220 612 460 628 700 650 S1200 676 1600 640" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/>
</svg>
